[versions]
anisekai-ffmpeg = "1.1.0"
anisekai-scheduler = "1.5.0"
catalogUpdater = "1.1.0"
jackson = "2.22.0"
jetbrainsAnnotations = "26.1.0"
junitBom = "6.1.0"
mockito = "5.23.0"
reckon = "2.0.0"
sentry = "6.11.0"
uuid-creator = "6.1.1"

[libraries]
anisekai-ffmpeg = { module = "fr.anisekai:ffmpeg4j", version.ref = "anisekai-ffmpeg" }
anisekai-scheduler = { module = "fr.anisekai:scheduler", version.ref = "anisekai-scheduler" }
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind", version.ref = "jackson" }
jetbrains-annotations = { module = "org.jetbrains:annotations", version.ref = "jetbrainsAnnotations" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junitBom" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platformLauncher = { module = "org.junit.platform:junit-platform-launcher" }
mockito-core = { module = "org.mockito:mockito-core", version.ref = "mockito" }
mockito-junit = { module = "org.mockito:mockito-junit-jupiter", version.ref = "mockito" }
uuid = { module = "com.github.f4b6a3:uuid-creator", version.ref = "uuid-creator" }

[plugins]
catalogUpdater = { id = "nl.littlerobots.version-catalog-update", version.ref = "catalogUpdater" }
reckon = { id = "org.ajoberstar.reckon", version.ref = "reckon" }
sentry = { id = "io.sentry.jvm.gradle", version.ref = "sentry" }

[bundles]
mockito = [
    "mockito-core",
    "mockito-junit",
]
